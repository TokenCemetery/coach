name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # go.mod declares the minimum supported Go; the image builds with a newer one.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: Lint e2e
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: e2e
          args: --config ../.golangci.yml
      - name: Build
        run: make build build-linux

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Unit tests
        run: make test
      - name: E2E
        run: make e2e

  container:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t coach:ci .
      - name: Smoke check
        run: scripts/check-container.sh coach:ci
