name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # go.mod declares the minimum supported Go; the image builds with a newer one.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - name: Lint e2e
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: e2e
          args: --config ../.golangci.yml
      - name: Build
        run: make build build-linux

  test:
    needs: build
    runs-on: ubuntu-24.04
    # FFmpeg 8.1, as in the image: HLS seek tests fail on older FFmpeg (#64).
    container: golang:1.25-alpine3.24
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg and the race detector toolchain
        run: apk add --no-cache ffmpeg gcc musl-dev make
      # File permission tests do not hold for root.
      - name: Add a non-root user
        run: adduser -D ci && chown -R ci .
      - name: Unit tests
        run: su ci -c "PATH=$PATH make test"
      - name: E2E
        run: su ci -c "PATH=$PATH make e2e"

  container:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t coach:ci .
      - name: Smoke check
        run: scripts/check-container.sh coach:ci
